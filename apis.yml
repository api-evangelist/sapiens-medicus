name: Sapiens Medicus
description: >-
  Sapiens Medicus operates Esculap.io, a consumer digital-health platform
  offering AI-powered doctor consultations delivered instantly through a web
  application. Marketed as "Your AI Doctor - Instant Medical Care Anytime," the
  service promises AI doctor consultations with medical specialist-level
  accuracy and high diagnostic confidence, with no appointments and no waiting
  times. Surfaced in the API Evangelist network as a 500 Global portfolio
  company, it is a consumer-facing React single-page application; as of this
  enrichment pass no public API, developer portal, SDK, machine-readable
  OpenAPI/AsyncAPI specification, MCP server, or /.well-known discovery surface
  is published on the esculap.io domain.
